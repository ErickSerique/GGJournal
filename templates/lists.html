{% extends "layout.html" %}

{% block title %}My Lists{% endblock %}

{% block main %}
<section class="page-header">
  <h2>Your Lists</h2>
  <a href="{{ url_for('create_list') }}" class="button-primary">+ New List</a>
</section>

{% if lists|length == 0 %}
  <p class="empty-message">You haven't created any lists yet.</p>
{% else %}
  <div class="lists-grid">
    {% for l in lists %}
      <div class="list-card">
        <h3><a href="{{ url_for('view_list', list_id=l.id) }}">{{ l.name }}</a></h3>
        <p>{{ l.description }}</p>
        <div class="list-actions">
          <a href="{{ url_for('edit_list', list_id=l.id) }}" class="btn-small">Edit</a>
          <form action="{{ url_for('delete_list', list_id=l.id) }}" method="POST" style="display:inline;">
            <button class="btn-small danger" type="submit">Delete</button>
          </form>
        </div>
      </div>
    {% endfor %}
  </div>
{% endif %}
{% endblock %}
