<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, width=device-width">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
  <title>{% block title %}{% endblock %} | GGJournal</title>
</head>

<body>
  <nav class="navbar">
    <div class="nav-container">
      <a class="nav-logo" href="/">GGJournal</a>
      <div class="nav-links">
        {% if session.get("user_id") %}
          <a href="{{ url_for('lists_page') }}">Lists</a>
          <a href="{{ url_for('search') }}">Search</a>
          <a href="{{ url_for('logout') }}">Logout</a>
        {% else %}
          <a href="{{ url_for('login') }}">Login</a>
          <a href="{{ url_for('register') }}">Register</a>
        {% endif %}
      </div>
    </div>
  </nav>

  {% if get_flashed_messages() %}
    <header><div class="flash-msg">{{ get_flashed_messages() | join(" ") }}</div></header>
  {% endif %}

  <main class="main-container">{% block main %}{% endblock %}</main>
</body>
</html>
